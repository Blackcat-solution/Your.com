name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/agent-worker/pyproject.toml
      - run: python -m pip install --upgrade pip ruff mypy
      - run: python -m pip install -e packages/mcp-connectors -e apps/agent-worker
      - run: ruff check apps/agent-worker/app packages/mcp-connectors/src
      - run: mypy --config-file apps/agent-worker/pyproject.toml apps/agent-worker/app packages/mcp-connectors/src/nexusrelay_mcp

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --workspaces --include-workspace-root
      - run: npm --workspace apps/web run lint
      - run: npm --workspace apps/web run typecheck

  containers:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/agent-worker/Dockerfile
          push: false
          tags: nexusrelay-agent-worker:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: nexusrelay-web:ci


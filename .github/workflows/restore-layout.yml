name: Restore NexusRelay layout
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore source tree and remove archive files
        shell: bash
        run: |
          unzip -q nexusrelay-source-fixed.zip -d /tmp/nexusrelay-source
          cp -a /tmp/nexusrelay-source/. .
          rm -f .github/workflows/ci.yml
          find . -maxdepth 1 -type f ! -name '.env.example' ! -name '.gitignore' ! -name 'README.md' -delete
          rm -f nexusrelay-source.zip nexusrelay-source-fixed.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore NexusRelay monorepo directory layout'
          git push origin HEAD:main

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oacp-merchant"
version = "0.1.0"
description = "Merchant-side OACP 0.1 reference client: signed manifests and checkout token redemption"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=44,<47",
  "httpx>=0.28,<1",
  "oacp-spec>=0.1,<1",
]

[project.scripts]
oacp-merchant = "oacp_merchant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

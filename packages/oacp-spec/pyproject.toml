[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oacp-spec"
version = "0.1.0"
description = "OACP 0.1 protocol schemas and validation helpers"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
